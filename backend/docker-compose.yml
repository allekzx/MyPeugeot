services:
  psa_car_controller:
    image: flobz/psa_car_controller
    container_name: psa_car_controller
    restart: unless-stopped
    ports:
      - "${PSACC_PORT:-5000}:5000"
    volumes:
      - ./config:/config
    environment:
      - PSACC_CONFIG_DIR=/config

  alert_watcher:
    build: ./alert_watcher
    container_name: alert_watcher
    restart: unless-stopped
    depends_on:
      - psa_car_controller
    ports:
      - "${ALERT_WATCHER_PORT:-5050}:5050"
    volumes:
      - ./config/alerts:/config
    environment:
      - VIN=${VIN}
      - PSACC_URL=http://psa_car_controller:5000
      - ALERT_POLL_SECONDS=${ALERT_POLL_SECONDS:-180}
