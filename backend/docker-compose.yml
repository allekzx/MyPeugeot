services:
  psa_car_controller:
    image: flobz/psa_car_controller
    container_name: psa_car_controller
    restart: unless-stopped
    ports:
      - "${PSACC_PORT:-5000}:5000"
    volumes:
      - ./config:/config
    environment:
      - PSACC_CONFIG_DIR=/config
      # -R <minutes> : rafraîchissement périodique natif de psa_car_controller.
      # Nécessaire pour que la surveillance de seuil de charge (%) et d'heure
      # d'arrêt (ChargeControl.process, déclenché à chaque rafraîchissement)
      # s'exécute réellement en arrière-plan — sans ça, ce seuil ne se
      # vérifie que quand quelque chose déclenche une lecture live
      # (from_cache=0), ce qui n'arrive pas tout seul.
      - PSACC_OPTIONS=-R ${PSACC_REFRESH_MINUTES:-15}

  alert_watcher:
    build: ./alert_watcher
    container_name: alert_watcher
    restart: unless-stopped
    depends_on:
      - psa_car_controller
    ports:
      - "${ALERT_WATCHER_PORT:-5050}:5050"
    volumes:
      - ./config/alerts:/config
    environment:
      - VIN=${VIN}
      - PSACC_URL=http://psa_car_controller:5000
      - ALERT_POLL_SECONDS=${ALERT_POLL_SECONDS:-180}
